# Netlify-configuratie voor cafecosta.nl

[build]
  command = "npm run build"
  publish = "dist"

# ── Redirects: oude Google-resultaten mogen niet doodlopen (bouwprompt §3) ──

[[redirects]]
  from = "/tickets"
  to = "/agenda"
  status = 301

[[redirects]]
  from = "/tickets/*"
  to = "/agenda"
  status = 301

[[redirects]]
  from = "/verhuur"
  to = "/groepen"
  status = 301

[[redirects]]
  from = "/verhuur/*"
  to = "/groepen"
  status = 301

[[redirects]]
  from = "/groepsarrangementen"
  to = "/groepen"
  status = 301

[[redirects]]
  from = "/groepsarrangementen/*"
  to = "/groepen"
  status = 301

[[redirects]]
  from = "/arrangementen"
  to = "/groepen"
  status = 301

[[redirects]]
  from = "/zaalverhuur"
  to = "/groepen"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/over"
  status = 301

# Overige oude paden → home. Geen force: bestaande pagina's en assets gaan altijd voor.
[[redirects]]
  from = "/*"
  to = "/"
  status = 301

# ── Headers ──

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Video en fonts mogen lang gecachet worden
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
